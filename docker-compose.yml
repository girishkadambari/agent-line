services:
  postgres:
    image: postgres:16-alpine
    container_name: vukho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vukho
      POSTGRES_PASSWORD: vukho
      POSTGRES_DB: vukho
    ports:
      - "5432:5432"
    volumes:
      - vukho_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vukho -d vukho"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    container_name: vukho-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: vukho
      POSTGRES_PASSWORD: vukho
      POSTGRES_DB: vukho_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vukho -d vukho_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vukho_postgres_data:
